version: 2
updates:
  # no cargo entry: this app builds against the core's client crate from a sibling
  # checkout Dependabot can't see, so its updates always failed; crate versions follow
  # the core repo, where Dependabot does run
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: dtolnay/rust-toolchain
